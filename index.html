<!DOCTYPE html>
<html>
<head>
<title> Kentr4x Injector Control Panel</title>
<style>
html,body{margin:0;height:100%;font-family:monospace;background:black;color:#0f0}
video{position:fixed;min-width:100%;min-height:100%;filter:brightness(30%)}
.panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
background:rgba(0,0,0,.65);border:1px solid #0f0;padding:30px;width:320px;box-shadow:0 0 20px #0f0}
input,button{width:100%;margin:6px 0;background:black;color:#0f0;border:1px solid #0f0;padding:8px}
pre{white-space:pre-wrap}
</style>
</head>
<body>
<video autoplay muted loop>
  <source src="video.mp4" type="video/mp4">
</video>
<div class="panel">
<h3> KENTR4X INJECTOR PANEL</h3>
<input id="key" placeholder="Enter License Key">
<button onclick="login()">LOGIN</button>
<pre id="msg">SYSTEM IDLE_</pre>
</div>

<script>
async function login(){
  const key=document.getElementById("key").value;
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key})});
  const j=await r.json();
  document.getElementById("msg").innerText=j.message;
}
</script>
</body>
</html>
